<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoreEngine Heavy Mechanical Clock (Steel Theme)</title>
    <style>
        /* 새로 주신 기계 배경 이미지 적용 + 약간의 어두운 음영 추가로 가독성 확보 */
        body {
            margin: 0;
            height: 100vh;
            background-color: #111;
            background-image: 
                radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.85) 100%),
                url('1000000118.png');
            background-size: cover;
            background-position: center;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 50개의 움직이는 개별 톱니바퀴 부품 */
        .gear {
            position: absolute;
            background-image: url('1000000117.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        /* 배경에서 돌아가는 50개의 스텝 모션 기어들 */
        #background-gears {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.9));
        }
        @keyframes tick-cw { 100% { transform: rotate(360deg); } }
        @keyframes tick-ccw { 100% { transform: rotate(-360deg); } }

        /* 전면부 대시보드 인터페이스 */
        #dashboard {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 600px;
        }

        /* 중앙 전자시계 (회색 강철 프레임) */
        #digital-clock {
            background: linear-gradient(145deg, #2a2a2a, #111111);
            padding: 15px 40px;
            border: 4px solid #666666;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 15px rgba(255, 255, 255, 0.1);
            font-size: 3.5rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #bbbbbb;
            letter-spacing: 4px;
        }

        /* 절반이 가려진 메인 날짜 기어들 */
        .gears-row {
            display: flex;
            gap: 20px;
        }

        /* 케이스(덮개)를 회색(Gray) 강철 느낌으로 변경 */
        .half-window {
            width: 140px;
            height: 70px; 
            position: relative;
            background: #000;
            border: 5px solid #4d4d4d; /* 짙은 회색 테두리 */
            border-top: 8px solid #8c8c8c; /* 밝은 회색 상단 덮개 */
            border-radius: 0 0 70px 70px;
            box-shadow: inset 0 15px 15px rgba(0,0,0,0.9), 0 10px 15px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        .main-gear {
            width: 140px;
            height: 140px;
            position: absolute;
            top: -70px;
            left: 0;
            animation: snap-advance 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }

        .main-gear::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('1000000117.png');
            background-size: cover;
            transform: rotate(22.5deg);
            z-index: 1;
            opacity: 0.9;
        }

        @keyframes snap-advance {
            0% { transform: rotate(-45deg); } 
            100% { transform: rotate(0deg); } 
        }

        /* 기어 위에 새겨질 텍스트 */
        .dial-text {
            position: absolute;
            top: 50%; left: 50%;
            z-index: 2;
            font-size: 16px;
            font-weight: 900;
            color: #666666; /* 기본 음각 색상 (짙은 회색) */
            text-shadow: 1px 1px 2px #000;
        }
        
        /* '오늘'을 가리키는 텍스트는 밝은 흰색으로 빛남 */
        .highlight-text {
            color: #ffffff;
            text-shadow: 0 0 8px #ffffff, 1px 1px 2px #000;
        }

        /* 오늘 위치를 가리키는 빨간색 포인터 유지 (포인트 컬러) */
        .pointer-container {
            position: absolute;
            top: 0; left: 50%;
            width: 2px;
            height: 70px;
            transform-origin: top center;
            transform: rotate(22.5deg); 
            z-index: 10;
        }
        .pointer-arrow {
            position: absolute;
            bottom: 2px;
            left: -8px;
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #ff3333;
            filter: drop-shadow(0 0 5px #ff0000);
        }

        /* 하단 라벨 (회색톤) */
        .label {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            color: #8c8c8c;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<!-- 화면을 꽉 채우는 50개의 거친 톱니바퀴들 -->
<div id="background-gears"></div>

<!-- 전면 제어 패널 -->
<div id="dashboard">
    <!-- 시계 -->
    <div id="digital-clock">00:00:00</div>

    <!-- 절반이 가려진 3개의 강철 톱니바퀴 창 (월, 일, 요일) -->
    <div class="gears-row">
        <div>
            <div class="half-window">
                <div class="pointer-container"><div class="pointer-arrow"></div></div>
                <div class="main-gear" id="gear-month"></div>
            </div>
            <div class="label">MONTH</div>
        </div>
        
        <div>
            <div class="half-window">
                <div class="pointer-container"><div class="pointer-arrow"></div></div>
                <div class="main-gear" id="gear-date"></div>
            </div>
            <div class="label">DATE</div>
        </div>

        <div>
            <div class="half-window">
                <div class="pointer-container"><div class="pointer-arrow"></div></div>
                <div class="main-gear" id="gear-day"></div>
            </div>
            <div class="label">DAY</div>
        </div>
    </div>
</div>

<script>
    // 50개의 배경 기계를 동적으로 생성
    const bgContainer = document.getElementById('background-gears');
    for (let i = 0; i < 50; i++) {
        let gear = document.createElement('div');
        gear.className = 'gear bg-gear';
        
        let size = Math.floor(Math.random() * 120) + 40; 
        gear.style.width = size + 'px';
        gear.style.height = size + 'px';
        gear.style.left = (Math.random() * 110 - 5) + 'vw';
        gear.style.top = (Math.random() * 110 - 5) + 'vh';
        
        let duration = Math.floor(Math.random() * 15) + 5;
        let steps = Math.floor(Math.random() * 20) + 8; 
        let dir = Math.random() > 0.5 ? 'tick-cw' : 'tick-ccw';
        
        gear.style.animation = `${dir} ${duration}s steps(${steps}) infinite`;
        gear.style.opacity = (Math.random() * 0.4 + 0.1).toFixed(2);
        
        bgContainer.appendChild(gear);
    }

    // 날짜 텍스트 세팅
    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    const angles = [247.5, 202.5, 157.5, 112.5]; 

    function buildDateGears() {
        const now = new Date();
        
        const dates = [
            new Date(now.getTime() - 86400000),     
            now,                                    
            new Date(now.getTime() + 86400000),     
            new Date(now.getTime() + 86400000 * 2)  
        ];

        document.getElementById('gear-month').innerHTML = '';
        document.getElementById('gear-date').innerHTML = '';
        document.getElementById('gear-day').innerHTML = '';

        dates.forEach((d, index) => {
            const isToday = (index === 1); 
            const angle = angles[index];

            addTextToGear('gear-month', monthNames[d.getMonth()], angle, isToday);
            addTextToGear('gear-date', d.getDate(), angle, isToday);
            addTextToGear('gear-day', dayNames[d.getDay()], angle, isToday);
        });
    }

    function addTextToGear(gearId, text, angle, isToday) {
        const gear = document.getElementById(gearId);
        const el = document.createElement('div');
        el.className = 'dial-text';
        if (isToday) el.classList.add('highlight-text');
        el.innerText = text;
        
        el.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-50px) rotate(-${angle}deg)`;
        gear.appendChild(el);
    }

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;
    }

    buildDateGears();
    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
