<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoreEngine Real Mechanical Clock</title>
    <style>
        /* 기본 배경 (어두운 기계실 내부) */
        body {
            margin: 0;
            height: 100vh;
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 톱니바퀴 기본 공통 속성 */
        .gear {
            position: absolute;
            background-image: url('1000000117.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        /* -------------------------------------------
           배경: 끊임없이 멈칫거리며(철컥철컥) 돌아가는 기계 장치들 
           (steps() 함수로 기계적 톱니 이동을 구현)
           ------------------------------------------- */
        #background-engine {
            position: absolute;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            opacity: 0.35; /* 뒤에 있는 부품 느낌 */
            pointer-events: none;
        }
        @keyframes tick-cw { 100% { transform: rotate(360deg); } }
        @keyframes tick-ccw { 100% { transform: rotate(-360deg); } }
        
        .bg-gear-1 { width: 350px; height: 350px; top: -50px; left: -100px; animation: tick-cw 10s steps(40) infinite; opacity: 0.6; }
        .bg-gear-2 { width: 280px; height: 280px; bottom: -80px; right: -50px; animation: tick-ccw 8s steps(30) infinite; opacity: 0.5; }
        .bg-gear-3 { width: 180px; height: 180px; top: 40%; left: 10%; animation: tick-cw 5s steps(20) infinite; opacity: 0.7; }
        .bg-gear-4 { width: 150px; height: 150px; bottom: 25%; left: 25%; animation: tick-ccw 4s steps(15) infinite; opacity: 0.8; }
        .bg-gear-5 { width: 220px; height: 220px; top: 15%; right: 15%; animation: tick-cw 7s steps(25) infinite; opacity: 0.6; }
        .bg-gear-6 { width: 120px; height: 120px; bottom: 45%; right: 25%; animation: tick-ccw 3s steps(12) infinite; opacity: 0.9; filter: brightness(1.5); }
        .bg-gear-7 { width: 400px; height: 400px; top: 30%; left: 30%; animation: tick-ccw 15s steps(60) infinite; opacity: 0.3; }
        .bg-gear-8 { width: 100px; height: 100px; top: 10%; left: 40%; animation: tick-cw 2s steps(8) infinite; opacity: 1; filter: brightness(1.2); }

        /* -------------------------------------------
           전경: 실제 날짜 데이터를 가리키는 거대한 메인 3대 기어
           ------------------------------------------- */
        #foreground-engine {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 500px;
            z-index: 10;
        }

        /* 메인 기어 컨테이너 (위치 잡기용) */
        .main-gear-box {
            position: absolute;
            width: 240px; 
            height: 240px;
            /* 디자인 입체감을 위한 그림자 */
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8)); 
        }

        /* 메인 기어 위치 배치 (서로 겹치도록 배치하여 맞물린 느낌 극대화) */
        #box-month { top: 8%; left: -10%; z-index: 12; }
        #box-date { top: 22%; right: -15%; z-index: 11; }
        #box-day { bottom: 12%; left: 50%; transform: translateX(-50%); z-index: 13; }

        /* 메인 기어 회전체 (날짜 바뀔 때마다 스프링처럼 철컥! 넘어가게 세팅) */
        .main-gear {
            width: 100%;
            height: 100%;
            transition: transform 1s cubic-bezier(0.5, 2.5, 0.4, 0.8); 
        }

        /* 현재 날짜를 가리키는 빨간색 포인터 (화살표) */
        .indicator {
            position: absolute;
            top: -15px; /* 기어 최상단 12시 방향 */
            left: 50%;
            transform: translateX(-50%);
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ff003c;
            z-index: 20;
            filter: drop-shadow(0 0 8px #ff003c);
        }

        /* 기어 톱니 위에 동그랗게 새겨질 텍스트(숫자/영문) */
        .dial-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform-origin: center;
            color: #d1d5db;
            font-size: 16px;
            font-weight: 900;
            text-shadow: 2px 2px 4px #000;
        }

        /* -------------------------------------------
           중앙: 심장부 전자시계
           ------------------------------------------- */
        #digital-clock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            background: rgba(5, 5, 10, 0.85);
            padding: 20px 35px;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            box-shadow: 0 0 25px #00ffcc, inset 0 0 10px #00ffcc;
            font-size: 3rem;
            font-weight: bold;
            backdrop-filter: blur(8px);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<!-- 1. 끝없이 돌아가는 배경 기계 장치들 -->
<div id="background-engine">
    <div class="gear bg-gear-1"></div>
    <div class="gear bg-gear-2"></div>
    <div class="gear bg-gear-3"></div>
    <div class="gear bg-gear-4"></div>
    <div class="gear bg-gear-5"></div>
    <div class="gear bg-gear-6"></div>
    <div class="gear bg-gear-7"></div>
    <div class="gear bg-gear-8"></div>
</div>

<!-- 2. 날짜를 표시하는 메인 시스템 -->
<div id="foreground-engine">
    
    <!-- 중앙 전자시계 -->
    <div id="digital-clock">00:00:00</div>

    <!-- 월(Month) 기어 -->
    <div class="main-gear-box" id="box-month">
        <div class="indicator"></div> <!-- 12시 방향 화살표 -->
        <div class="gear main-gear" id="gear-month"></div>
    </div>

    <!-- 일(Date) 기어 -->
    <div class="main-gear-box" id="box-date">
        <div class="indicator"></div>
        <div class="gear main-gear" id="gear-date"></div>
    </div>

    <!-- 요일(Day) 기어 -->
    <div class="main-gear-box" id="box-day">
        <div class="indicator"></div>
        <div class="gear main-gear" id="gear-day"></div>
    </div>

</div>

<script>
    // 날짜 데이터 세팅
    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const dayNames = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
    // 1일부터 31일까지 배열 생성
    const dates = Array.from({length: 31}, (_, i) => i + 1);

    // 톱니바퀴 표면에 텍스트를 둥글게 배치하는 함수
    function buildGearDial(gearId, items) {
        const gear = document.getElementById(gearId);
        const radius = 85; // 텍스트가 새겨질 원의 반지름 (기어 크기에 맞춤)
        const angleStep = 360 / items.length; // 항목 개수만큼 각도 분할
        
        items.forEach((item, index) => {
            const el = document.createElement('div');
            el.className = 'dial-text';
            el.innerText = item;
            
            // 중앙(50%,50%)을 기준으로 각도만큼 회전한 후, 바깥쪽(radius)으로 밀어냄
            el.style.transform = `translate(-50%, -50%) rotate(${index * angleStep}deg) translateY(-${radius}px)`;
            gear.appendChild(el);
        });
    }

    // 3대 메인 기어 조립 (숫자/글자 새기기)
    buildGearDial('gear-month', monthNames);
    buildGearDial('gear-date', dates);
    buildGearDial('gear-day', dayNames);

    // 시간 업데이트 및 기어 회전 함수
    function updateEngine() {
        const now = new Date();
        
        // 1. 심장부 전자시계 업데이트
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('digital-clock').innerText = `${h}:${m}:${s}`;

        // 2. 메인 기어들 회전 (현재 날짜가 화살표(상단)에 오도록 역방향으로 각도 계산)
        
        // 월 (0~11 인덱스)
        const monthAngle = -(now.getMonth() * (360 / 12));
        document.getElementById('gear-month').style.transform = `rotate(${monthAngle}deg)`;
        
        // 일 (1~31 -> 인덱스 0~30 계산)
        const dateAngle = -((now.getDate() - 1) * (360 / 31));
        document.getElementById('gear-date').style.transform = `rotate(${dateAngle}deg)`;
        
        // 요일 (0~6 인덱스, 0=일요일)
        const dayAngle = -(now.getDay() * (360 / 7));
        document.getElementById('gear-day').style.transform = `rotate(${dayAngle}deg)`;
    }

    // 1초(1000ms)마다 엔진 가동
    setInterval(updateEngine, 1000);
    
    // 앱 켜자마자 즉시 시간 동기화 (기어들이 철컥! 하며 제자리를 찾아감)
    // 약간의 딜레이를 주어 사용자가 접속하자마자 기계가 맞춰지는 애니메이션을 감상하게 함
    setTimeout(updateEngine, 100); 
</script>

</body>
</html>
